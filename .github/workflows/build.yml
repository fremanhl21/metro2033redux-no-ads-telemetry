name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build the release archives and check the hashes
        run: python build.py

      - name: Check that the PowerShell scripts parse
        shell: pwsh
        run: |
          foreach ($f in 'src/NoAdsTelemetry.ps1', 'src-lastlight/NoAdsTelemetry.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/$f", [ref]$null, [ref]$errors)
            if ($errors) { $errors | Format-List; exit 1 }
            "${f}: no parse errors"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: no-ads-and-telemetry
          path: dist/*.zip
