name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the release archive and check the hashes
        run: python build.py

      - name: Check that the PowerShell script parses
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/src/NoAdsTelemetry.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | Format-List; exit 1 }
          'NoAdsTelemetry.ps1: no parse errors'

      - uses: actions/upload-artifact@v4
        with:
          name: no-ads-and-telemetry
          path: dist/*.zip
